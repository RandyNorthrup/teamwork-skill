name: certify

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: certify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python scripts/certify.py --require-clean --output certification-results/${{ matrix.os }}-py${{ matrix.python }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: certification-${{ matrix.os }}-py${{ matrix.python }}
          path: certification-results/*.json
          if-no-files-found: error

  open-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: git clone https://github.com/agentskills/agentskills.git skills-reference
      - run: git -C skills-reference checkout 69ef37e9424c0a7ea9dd2293b559e43ec8176379
      - run: python -m pip install --disable-pip-version-check ./skills-reference/skills-ref
      - run: skills-ref validate skills/teamwork-handoff
      - run: skills-ref validate skills/teamwork-resume

  package:
    needs: [test, open-format]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Validate tag matches VERSION
        if: github.ref_type == 'tag'
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
      - run: python scripts/build_release.py --require-clean --json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: teamwork-skills-package-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
